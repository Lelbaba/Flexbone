name: Deploy production
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
        env:
          REGION: ${{ vars.GCP_REGION }}
      - name: Build and push immutable image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/flexbone/flexbone-ocr:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
        env:
          REGION: ${{ vars.GCP_REGION }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      - name: Deploy
        run: |
          gcloud run deploy flexbone-ocr --image "$IMAGE" --region "$REGION" \
            --service-account "ocr-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --cpu 1 --memory 512Mi --concurrency 8 --min 0 --max 5 --timeout 60 \
            --default-url --no-invoker-iam-check --quiet
          URL="$(gcloud run services describe flexbone-ocr --region "$REGION" --format='value(status.url)')"
          curl --fail --retry 5 "$URL/health"
          echo "CLOUD_RUN_URL=$URL" >> "$GITHUB_ENV"
        env:
          REGION: ${{ vars.GCP_REGION }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      - name: Verify real OCR
        run: |
          uv sync --frozen
          uv run pytest tests/test_integration.py -m integration --no-cov
        env:
          OCR_INTEGRATION_BASE_URL: ${{ env.CLOUD_RUN_URL }}
