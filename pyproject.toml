[project]
name = "flexbone-ocr"
version = "0.1.0"
description = "Stateless FastAPI OCR service backed by Google Cloud Vision"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<0.116",
  "google-cloud-vision>=3.8.0,<4",
  "pillow>=11.0.0,<12",
  "pydantic-settings>=2.6.0,<3",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.32.0,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0,<0.29",
  "mypy>=1.13.0,<2",
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.24.0,<1",
  "pytest-cov>=6.0.0,<7",
  "ruff>=0.8.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_service"]

[tool.pytest.ini_options]
addopts = "--cov=ocr_service --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: calls a deployed OCR service and Google Cloud Vision"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ocr_service"]

[[tool.mypy.overrides]]
module = ["google.cloud.*", "google.api_core.*", "PIL.*"]
ignore_missing_imports = true
