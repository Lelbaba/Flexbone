<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">FastAPI OCR request flow</title>
  <desc id="desc">A request passes through middleware, a FastAPI route, image processing functions, and one Google Vision function before a JSON response is returned.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#17231d" flood-opacity="0.08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2e6b4c"/></marker>
    <marker id="error-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a65c4c"/></marker>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#17231d;letter-spacing:-1px}.subtitle{font:400 15px Inter,Arial,sans-serif;fill:#657069}.lane{fill:#fbfaf6;stroke:#dedcd2;stroke-width:1.5}.lane-title{font:600 11px Inter,Arial,sans-serif;fill:#66726b;letter-spacing:1.5px}.card{fill:#fff;stroke:#d7d5ca;stroke-width:1.5;filter:url(#shadow)}.green{fill:#f1f8e8;stroke:#9fbe83}.dark{fill:#193b2c;stroke:#193b2c}.red{fill:#fff2ed;stroke:#d5a69b}.label{font:600 15px Inter,Arial,sans-serif;fill:#17231d}.label-light{font:600 15px Inter,Arial,sans-serif;fill:#fff}.meta{font:400 11px Inter,Arial,sans-serif;fill:#6c7771}.meta-light{font:400 11px Inter,Arial,sans-serif;fill:#d6e5dd}.step{font:700 9px Inter,Arial,sans-serif;fill:#2e6b4c;letter-spacing:1px}.step-light{font:700 9px Inter,Arial,sans-serif;fill:#badd9d;letter-spacing:1px}.line{fill:none;stroke:#2e6b4c;stroke-width:3;marker-end:url(#arrow)}.return{fill:none;stroke:#829087;stroke-width:2;stroke-dasharray:6 6;marker-end:url(#arrow)}.error{fill:none;stroke:#a65c4c;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#error-arrow)}
    </style>
  </defs>
  <rect width="1500" height="650" rx="24" fill="#f4f1e8"/>
  <text class="title" x="54" y="62">One request, five understandable steps</text>
  <text class="subtitle" x="54" y="88">There is no service hierarchy or provider interface: routes call processing functions, which call one Vision function.</text>

  <rect class="lane" x="40" y="124" width="1420" height="300" rx="18"/>
  <text class="lane-title" x="64" y="153">SUCCESS PATH</text>

  <g transform="translate(75 197)">
    <rect class="card" width="200" height="126" rx="14"/>
    <text class="step" x="22" y="29">01 · REQUEST</text>
    <text class="label" x="22" y="59">Multipart upload</text>
    <text class="meta" x="22" y="86">image or images fields</text>
    <text class="meta" x="22" y="105">metadata / normalize flags</text>
  </g>
  <g transform="translate(355 197)">
    <rect class="card green" width="220" height="126" rx="14"/>
    <text class="step" x="22" y="29">02 · MIDDLEWARE</text>
    <text class="label" x="22" y="59">Protect and identify</text>
    <text class="meta" x="22" y="86">Reject oversized bodies</text>
    <text class="meta" x="22" y="105">Start timer + request ID</text>
  </g>
  <g transform="translate(655 197)">
    <rect class="card" width="200" height="126" rx="14"/>
    <text class="step" x="22" y="29">03 · APP.PY</text>
    <text class="label" x="22" y="59">FastAPI route</text>
    <text class="meta" x="22" y="86">Check field count</text>
    <text class="meta" x="22" y="105">Call processing function</text>
  </g>
  <g transform="translate(935 197)">
    <rect class="card dark" width="220" height="126" rx="14"/>
    <text class="step-light" x="22" y="29">04 · PROCESSING.PY</text>
    <text class="label-light" x="22" y="59">Validate and coordinate</text>
    <text class="meta-light" x="22" y="86">Pillow · limits · batch</text>
    <text class="meta-light" x="22" y="105">timeout · response model</text>
  </g>
  <g transform="translate(1235 197)">
    <rect class="card green" width="190" height="126" rx="14"/>
    <text class="step" x="22" y="29">05 · VISION.PY</text>
    <text class="label" x="22" y="59">Google Vision</text>
    <text class="meta" x="22" y="86">OCR + bounded retries</text>
    <text class="meta" x="22" y="105">Text + confidence</text>
  </g>

  <path class="line" d="M275 260H355"/><path class="line" d="M575 260H655"/><path class="line" d="M855 260H935"/><path class="line" d="M1155 260H1235"/>
  <path class="return" d="M1330 323V380H755V323"/>
  <text class="meta" x="910" y="401">JSON response returns through the route and middleware</text>

  <rect class="lane" x="40" y="452" width="1420" height="150" rx="18"/>
  <text class="lane-title" x="64" y="481">ONE FAILURE PATH</text>
  <rect class="card red" x="292" y="507" width="270" height="64" rx="14"/>
  <text class="label" x="316" y="535">AppError with one code</text>
  <text class="meta" x="316" y="555">Status and safe message come from a table</text>
  <rect class="card red" x="655" y="507" width="270" height="64" rx="14"/>
  <text class="label" x="679" y="535">FastAPI error handler</text>
  <text class="meta" x="679" y="555">Builds the stable error envelope</text>
  <rect class="card" x="1018" y="507" width="270" height="64" rx="14"/>
  <text class="label" x="1042" y="535">Sanitized JSON response</text>
  <text class="meta" x="1042" y="555">Request ID and timing headers included</text>
  <path class="error" d="M562 539H655"/><path class="error" d="M925 539H1018"/>
  <path class="error" d="M1045 323V468Q1045 487 1026 487H427V507"/>
  <path class="error" d="M1330 323V468Q1330 487 1311 487H427V507"/>
</svg>
